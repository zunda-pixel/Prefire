# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Run ${{ matrix.xcode }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_16.4"
            runsOn: macos-15
          - xcode: "Xcode_26.4"
            runsOn: macos-26
    steps:
      - uses: actions/checkout@v6
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app

      # SnapshotTesting brings swift-syntax along, which takes long to clone.
      - name: Cache iOS test packages
        uses: actions/cache@v4
        with:
          path: PrefireSnapshotTests/.build/SourcePackages
          key: ios-test-packages-${{ matrix.xcode }}-${{ hashFiles('PrefireSnapshotTests/Package.resolved') }}
          restore-keys: ios-test-packages-${{ matrix.xcode }}-

      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            .build
            PrefirePluginTests/.build
          key: swiftpm-builds-${{ matrix.xcode }}-${{ hashFiles('Package.resolved', 'PrefirePluginTests/Package.resolved') }}
          restore-keys: swiftpm-builds-${{ matrix.xcode }}-

      - name: Build Prefire
        run: make build

      - name: Run Prefire macOS Tests
        run: swift test

      # Services the tests do not use are turned off before xcodebuild boots the simulator,
      # which then boots and starts the tests sooner.
      - name: Run Prefire iOS Tests
        run: make slim-sim test-ios

      - name: Build a package with the plugins
        run: make test-plugins

      - name: Build and pack the release binary
        run: |
          make archive
          mkdir -p "$RUNNER_TEMP/prefire"
          tar -xzf prefire.tar.gz -C "$RUNNER_TEMP/prefire"
          "$RUNNER_TEMP/prefire/prefire" --version
          "$RUNNER_TEMP/prefire/prefire" --help | grep -q "Generate Playbook"
