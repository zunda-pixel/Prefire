# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Run ${{ matrix.xcode }}
    runs-on: ${{ matrix.runsOn }}
    # The package builds the generator and swift-syntax from source.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_16.4"
            runsOn: macos-15
          - xcode: "Xcode_26.4"
            runsOn: macos-26
    steps:
      - uses: actions/checkout@v6
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app

      # SnapshotTesting brings swift-syntax along, which takes long to clone.
      - name: Cache iOS test packages
        uses: actions/cache@v4
        with:
          path: PrefireSnapshotTests/.build/SourcePackages
          key: ios-test-packages-${{ matrix.xcode }}-${{ hashFiles('PrefireSnapshotTests/Package.resolved') }}
          restore-keys: ios-test-packages-${{ matrix.xcode }}-
        
      - name: Build Prefire
        run: make build

      - name: Run Prefire macOS Tests
        run: swift test

      # Services the tests do not use are turned off before xcodebuild boots the simulator,
      # which then boots and starts the tests sooner.
      - name: Run Prefire iOS Tests
        run: make slim-sim test-ios

      # The plugins build the generator from source and declare the files it writes in advance.
      # Only on the newest Xcode, which the Example is kept up with.
      - name: Build the Example with the plugins
        if: matrix.xcode == 'Xcode_26.4'
        run: make test-plugins

      - name: Build prefire CLI
        run: make cli

      - name: Smoke test prefire CLI
        run: |
          set -euo pipefail
          bin=$(pwd)/.build/release/prefire
          $bin --version
          $bin --help | grep -q "Generate Playbook"
          cd /tmp && $bin --version

  executable-tests:
    name: PrefireExecutable tests ${{ matrix.xcode }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_16.4"
            runsOn: macos-15
          - xcode: "Xcode_26.4"
            runsOn: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app

      # Building swift-syntax takes most of `make test`. Sources checked out anew are newer than the
      # cache, so they are rebuilt; only the dependencies are reused.
      - name: Cache PrefireExecutable build
        uses: actions/cache@v4
        with:
          path: PrefireExecutable/.build
          key: prefire-executable-${{ matrix.xcode }}-${{ hashFiles('PrefireExecutable/Package.resolved') }}
          restore-keys: prefire-executable-${{ matrix.xcode }}-

      - name: Run PrefireExecutable Tests
        run: make test
